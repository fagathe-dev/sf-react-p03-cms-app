# config/packages/security.yaml
security:
    password_hashers:
        Fagathe\CmsCore\Entity\User: "auto"
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # Hiérarchie des rôles en cascade (du plus bas au plus haut)
    role_hierarchy:
        ROLE_CONTRIBUTOR: [ROLE_USER]
        ROLE_EDITOR: [ROLE_CONTRIBUTOR]
        ROLE_MODERATOR: [ROLE_EDITOR]
        ROLE_MANAGER: [ROLE_MODERATOR]
        ROLE_ADMIN: [ROLE_MANAGER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    providers:
        # Pas de "property" : Doctrine délègue à UserRepository::loadUserByIdentifier()
        # (e-mail OU username), ce qui garantit que le JWT recharge l'utilisateur
        # quel que soit l'identifiant retourné par User::getUserIdentifier().
        app_user_provider:
            entity:
                class: Fagathe\CmsCore\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: Fagathe\CmsCore\Security\UserChecker
            # 1. POST /api/auth/login → ApiAuthenticator (identifiant + mot de passe Base64 → JWT)
            custom_authenticators:
                - Fagathe\CmsCore\Security\ApiAuthenticator
            # 2. Toutes les autres requêtes → JWT Lexik (header Authorization: Bearer …)
            jwt: ~
            # Réponse 401 JSON de Lexik quand un endpoint protégé est appelé sans token
            entry_point: jwt

    access_control:
        - {
              path: ^/api/auth/(login|logout|register|verify-otp|resend-otp|forgot-password|reset-password),
              roles: PUBLIC_ACCESS,
          }
        - { path: ^/api/health-check, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_REMEMBERED }

when@test:
    security:
        password_hashers:
            # Clé identique à la config principale pour que la surcharge s'applique bien à User
            Fagathe\CmsCore\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
