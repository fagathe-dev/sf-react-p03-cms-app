security:
    password_hashers:
        Fagathe\CmsCore\Entity\User: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Hiérarchie des rôles en cascade (du plus bas au plus haut)
    role_hierarchy:
        ROLE_CONTRIBUTOR: [ROLE_USER]
        ROLE_EDITOR: [ROLE_CONTRIBUTOR]
        ROLE_MODERATOR: [ROLE_EDITOR]
        ROLE_MANAGER: [ROLE_MODERATOR]
        ROLE_ADMIN: [ROLE_MANAGER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    providers:
        app_user_provider:
            entity:
                class: Fagathe\CmsCore\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth/(login|register|verify-otp|resend-otp|forgot-password|reset-password), roles: PUBLIC_ACCESS }
        - { path: ^/api/health-check, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10